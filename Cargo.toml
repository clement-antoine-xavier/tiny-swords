[package]
name = "tiny-swords"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.0"

# Parses the Tiled map authored in assets/Main.tmx (no Bevy dependency, so it
# works regardless of the engine version).
tiled = "0.16"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3